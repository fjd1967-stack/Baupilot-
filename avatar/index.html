<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avatar-Assistentin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14161a; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0 0 210px 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 210px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #1d2026; border-top: 1px solid #2c313a; display: flex; flex-direction: column; gap: 8px; }
  #log { flex: 1; overflow-y: auto; font-size: 15px; line-height: 1.35; }
  .u { color: #9ecbff; margin: 2px 0; } .a { color: #eee; margin: 2px 0; } .s { color: #888; font-size: 13px; margin: 2px 0; }
  #row { display: flex; gap: 8px; }
  #in { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #3a404b; background: #14161a; color: #eee; }
  button { font-size: 16px; border: 0; border-radius: 10px; padding: 10px 14px; background: #2f6feb; color: #fff; }
  button.mic.on { background: #d33; }
  button.sec { background: #3a404b; }
  #status { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 13px; color: #aaa; }
  dialog { background: #1d2026; color: #eee; border: 1px solid #3a404b; border-radius: 12px; max-width: 460px; width: 92%; }
  dialog input, dialog textarea, dialog select { width: 100%; font-size: 16px; padding: 8px; margin: 4px 0 10px; border-radius: 8px; border: 1px solid #3a404b; background: #14161a; color: #eee; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">Lade Avatar …</div>
<div id="ui">
  <div id="log"></div>
  <div id="row">
    <button class="mic" id="mic">🎤</button>
    <input id="in" placeholder="Oder hier tippen …" autocomplete="off">
    <button id="send">Senden</button>
    <button class="sec" id="cfg">⚙︎</button>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 style="margin-top:0">Einstellungen</h3>
    <label>Anthropic-API-Schlüssel (bleibt nur in diesem Browser)</label>
    <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">
    <label>Modell</label>
    <input id="model" value="claude-sonnet-5-5">
    <label>Name des Avatars</label>
    <input id="name" value="Jarvis">
    <label>Stimme</label>
    <select id="voice"></select>
    <label><input type="checkbox" id="auto" checked style="width:auto"> Nach der Antwort automatisch weiter zuhören</label>
    <label>Anweisung an den Avatar</label>
    <textarea id="sys" rows="4"></textarea>
    <button value="ok">Speichern</button>
  </form>
</dialog>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const store = {
  get: (k, d = '') => { try { return localStorage.getItem('av_' + k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('av_' + k, v); } catch {} }
};
const DEFAULT_SYS = 'Du bist eine freundliche, sprechende Assistentin. Antworte auf Deutsch in kurzen, gesprochenen Sätzen ohne Listen, ohne Markdown und ohne Sonderzeichen.';
const setStatus = t => $('status').textContent = t;
const log = $('log');
const add = (cls, t) => { const d = document.createElement('div'); d.className = cls; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

// ---------- 3D-Avatar ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Selbstgebauter Avatar (keine Modelldatei nötig): Kopf, lange Haare, Augen, Mund
const M = (color, rough = 0.6) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 });
const ell = (r, sx, sy, sz, mat, x = 0, y = 0, z = 0, parent) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), mat);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z); (parent || avatar).add(m); return m;
};
const avatar = new THREE.Group(); scene.add(avatar);
const skin = M(0xf0c4a4, 0.55), skinDark = M(0xe2ad8c, 0.6);
const hairM = M(0x4a2a16, 0.45), cloth = M(0x2f4f7f, 0.8);
const headG = new THREE.Group(); avatar.add(headG);
const hairG = new THREE.Group(); avatar.add(hairG);

// Körper
ell(1, 1.55, 0.6, 0.85, cloth, 0, -2.15, 0);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.9, 32), skin); neck.position.set(0, -1.2, 0); avatar.add(neck);
// Haare hinten (lang) und Seiten
ell(1, 1.12, 2.1, 0.7, hairM, 0, -1.0, -0.45, hairG);
ell(1, 1.02, 1.2, 1.0, hairM, 0, 0.05, -0.2, hairG);
ell(1, 0.2, 1.55, 0.4, hairM, -0.92, -0.75, 0.1, hairG);
ell(1, 0.2, 1.55, 0.4, hairM, 0.92, -0.75, 0.1, hairG);
// Kopf
ell(1, 0.88, 1.05, 0.92, skin, 0, 0, 0, headG);
// Haaransatz oben (Kappe + Scheitel-Strähnen)
const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32, 0, Math.PI * 2, 0, 1.05), hairM);
cap.scale.set(0.93, 1.1, 0.97); cap.position.set(0, 0.02, -0.02); headG.add(cap);
ell(1, 0.5, 0.5, 0.3, hairM, -0.5, 0.78, 0.72, headG);
ell(1, 0.5, 0.5, 0.3, hairM, 0.45, 0.8, 0.7, headG);
// Nase, Wangen
ell(0.12, 1, 1.2, 0.8, skinDark, 0, -0.1, 0.9, headG);
// Augen
const eyes = [];
for (const sx of [-1, 1]) {
  const x = sx * 0.33;
  ell(0.14, 1, 0.8, 0.6, M(0xffffff, 0.3), x, 0.14, 0.8, headG);
  ell(0.075, 1, 1, 0.6, M(0x3b6ea5, 0.3), x, 0.14, 0.87, headG);
  ell(0.035, 1, 1, 0.6, M(0x050505, 0.2), x, 0.14, 0.9, headG);
  const lid = ell(0.15, 1, 1, 0.7, skin, x, 0.14, 0.8, headG); lid.scale.y = 0.001; eyes.push(lid);
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.05), hairM);
  brow.position.set(x, 0.4, 0.82); brow.rotation.z = -sx * 0.12; headG.add(brow);
}
// Mund: dunkle Öffnung + Ober-/Unterlippe
const mouthY = -0.46;
const openM = ell(0.2, 1, 0.05, 0.25, M(0x5a1f25, 0.7), 0, mouthY, 0.82, headG);
const lipM = M(0xc4605f, 0.45);
const upper = ell(0.2, 1, 0.2, 0.35, lipM, 0, mouthY + 0.02, 0.83, headG);
const lower = ell(0.19, 1, 0.24, 0.35, lipM, 0, mouthY - 0.03, 0.83, headG);

camera.position.set(0, -0.35, 8.6); camera.lookAt(0, -0.55, 0);
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(2, 3, 5); scene.add(dl);
setStatus('Bereit. Tippe auf das Mikrofon.');

let speaking = false, nextBlink = 2, blink = 0, t0 = performance.now();
let mouth = 0; // 0..1, vom Sprechen getrieben
const smooth = { jaw: 0, smile: 0 };

function frame(now) {
  requestAnimationFrame(frame);
  const t = (now - t0) / 1000;
  headG.rotation.y = Math.sin(t * 0.5) * 0.1;
  headG.rotation.x = Math.sin(t * 0.37) * 0.03;
  hairG.rotation.y = headG.rotation.y * 0.6;
  avatar.position.y = Math.sin(t * 1.1) * 0.015;
  // Lippenbewegung: Silben-ähnlicher Rhythmus, solange gesprochen wird
  const target = speaking ? Math.max(0, Math.sin(t * 13) * 0.5 + Math.sin(t * 7.3) * 0.3 + 0.25) * mouth : 0;
  smooth.jaw += (target - smooth.jaw) * 0.35;
  const open = smooth.jaw;
  openM.scale.y = 0.04 + open * 0.2;
  upper.position.y = mouthY + 0.02 + open * 0.06;
  lower.position.y = mouthY - 0.03 - open * 0.14;
  // Blinzeln
  if (t > nextBlink) { blink = 1; nextBlink = t + 2 + Math.random() * 3; }
  blink = Math.max(0, blink - 0.12);
  for (const l of eyes) l.scale.y = 0.001 + blink;
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// ---------- Stimme ----------
let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('de'));
  const sel = $('voice'); sel.innerHTML = '';
  voices.forEach((v, i) => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o); });
  const saved = store.get('voice'); if (saved) sel.value = saved;
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speak(text) {
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    const v = voices.find(x => x.name === store.get('voice')) || voices.find(x => /anna|petra|marlene|katja|female|weiblich/i.test(x.name)) || voices[0];
    if (v) u.voice = v;
    u.rate = 1.0; u.pitch = 1.05;
    u.onstart = () => { speaking = true; mouth = 1; setStatus('Spricht …'); };
    u.onboundary = () => { mouth = 0.6 + Math.random() * 0.5; };
    u.onend = u.onerror = () => { speaking = false; res(); };
    speechSynthesis.speak(u);
  });
}

// ---------- Mikrofon ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, busy = false;
function startListening() {
  if (!SR) { setStatus('Spracherkennung fehlt. Nutze Safari oder Chrome.'); return; }
  if (busy || listening) return;
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { listening = true; $('mic').classList.add('on'); setStatus('Ich höre zu …'); };
  rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; finalText = t; setStatus(t || 'Ich höre zu …'); };
  rec.onerror = e => {
    listening = false; $('mic').classList.remove('on'); finalText = '';
    if (e.error === 'not-allowed') setStatus('Mikrofon blockiert. Bitte im Browser erlauben.');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') setStatus('Fehler: ' + e.error);
  };
  rec.onend = () => {
    listening = false; $('mic').classList.remove('on');
    const t = finalText.trim();
    if (t) send(t); else if (!busy) setStatus('Nichts gehört. Tippe auf das Mikrofon.');
  };
  try { rec.start(); } catch {}
}
$('mic').onclick = () => listening ? rec.stop() : startListening();

// ---------- Claude ----------
const history = [];
async function send(text) {
  const key = store.get('key');
  if (!key) { $('dlg').showModal(); setStatus('Bitte zuerst den API-Schlüssel eintragen.'); return; }
  busy = true;
  add('u', text); history.push({ role: 'user', content: text });
  const bubble = add('a', '…'); setStatus('Denkt nach …');
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: store.get('model', 'claude-sonnet-5-5'), max_tokens: 1024, system: store.get('sys', DEFAULT_SYS), messages: history.slice(-30) })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.status);
    const reply = j.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    history.push({ role: 'assistant', content: reply });
    bubble.textContent = reply; log.scrollTop = log.scrollHeight;
    busy = false;
    await speak(reply);
    setStatus('Bereit.');
    if ($('auto').checked) startListening();
  } catch (e) {
    busy = false; history.pop();
    bubble.textContent = 'Fehler: ' + e.message; bubble.className = 's';
    setStatus('Fehler bei der Anfrage.');
  }
}
const submit = () => { const t = $('in').value.trim(); if (t && !busy) { $('in').value = ''; send(t); } };
$('send').onclick = submit;
$('in').onkeydown = e => { if (e.key === 'Enter') submit(); };

// ---------- Einstellungen ----------
$('key').value = store.get('key');
$('model').value = store.get('model', 'claude-sonnet-5-5');
$('name').value = store.get('name', 'Jarvis');
$('sys').value = store.get('sys', DEFAULT_SYS);
$('auto').checked = store.get('auto', '1') === '1';
$('cfg').onclick = () => { loadVoices(); $('dlg').showModal(); };
$('dlg').addEventListener('close', () => {
  store.set('key', $('key').value.trim()); store.set('model', $('model').value.trim());
  store.set('name', $('name').value.trim()); store.set('sys', $('sys').value);
  store.set('voice', $('voice').value); store.set('auto', $('auto').checked ? '1' : '0');
});
add('s', 'Tippe auf das Mikrofon und sprich. Beim ersten Mal den API-Schlüssel unter ⚙︎ eintragen.');
if (!store.get('key')) setTimeout(() => $('dlg').showModal(), 600);
</script>
</body>
</html>
