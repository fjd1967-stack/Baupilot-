<style>
/* Layout: eine Spalte wie das Papierformular, Kopfzeile mit Nr./Datum fest oben, Tabs für Tag / Verlauf / Baustelle */
:root{
  --bg:#e9ebea; --paper:#f8f9f8; --ink:#1b2225; --mute:#5d686c; --line:#c3cacc;
  --accent:#c4500a; --accent-ink:#ffffff; --field:#ffffff; --band:#dde2e2;
  --ok:#2d7a4b; --warn:#a36a00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191b; --paper:#1c2326; --ink:#e7ecec; --mute:#98a4a8; --line:#35403f;
  --accent:#ee7a36; --accent-ink:#1a0e05; --field:#12181a; --band:#27302f; --ok:#58b57e; --warn:#e0a63a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191b; --paper:#1c2326; --ink:#e7ecec; --mute:#98a4a8; --line:#35403f;
  --accent:#ee7a36; --accent-ink:#1a0e05; --field:#12181a; --band:#27302f; --ok:#58b57e; --warn:#e0a63a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin-inline:auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:860px;margin-inline:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin-right:auto}

.tabs{display:flex;gap:4px;width:100%}
.tab{flex:1;padding:9px 6px;border:1px solid var(--line);background:transparent;border-radius:6px;font:600 15px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tabs[hidden]{display:none}
.rubnav{padding-top:10px;padding-bottom:0}

.homebtn{text-align:left;padding:11px 14px;flex:none;width:100%}
.rubs::-webkit-scrollbar{display:none}
.rubs .tab{flex:none;width:100%;text-align:left;padding:11px 14px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-top:14px}
.sec{padding:14px 16px;border-top:1px solid var(--line)}

.dayid .date{font:700 28px/1.1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums}

.projline{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14px}

.tempwrap{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.chips .temp{width:78px}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--field);border-radius:5px;min-width:0}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.autobadge{font-size:12px;color:var(--ok);margin-left:4px}

.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.aetr{margin-top:8px}.aetr .tb{margin:8px 0;padding:9px 10px;border:2px solid #1a56c4;border-radius:6px;background:var(--field);color:var(--ink);font-size:20px;line-height:1.5;font-weight:700;white-space:pre-wrap}.aetr .tb small{display:block;font-size:13px;font-weight:700;margin-bottom:4px;color:#1a56c4}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}

.status{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:9}

.kwhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.kwhead h3{margin:0;font:700 20px var(--display);letter-spacing:.04em;text-transform:uppercase}
.day{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;border-inline:0;border-bottom:0;min-width:0}
.day:first-child{border-top:0}
.chk{flex:none;width:34px;height:34px;margin-left:10px;border:2px solid var(--line);border-radius:50%;background:var(--field);font-weight:700;color:#fff}.chk.on{background:#2e7d32;border-color:#2e7d32}.due.late{color:#b3261e;font-weight:600}.due.today{color:var(--accent);font-weight:600}.due.soon{color:var(--accent)}
.prow2{display:flex;align-items:center;border-top:1px solid var(--line)}.prow2 .day{border-top:0;flex:1}.prow2 .x{margin:0 10px;flex:none}.prow2.asking .day .p{display:none}.delq{display:flex;gap:6px;align-items:center;padding-right:10px;font-size:13px;white-space:nowrap}
.day .n{font:700 20px var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.day .d{min-width:0}
.day .d b{font-weight:600}
.day .d small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .p{font:600 14px var(--display);letter-spacing:.05em;color:var(--mute);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid2 label{display:block;font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.grid2 .full{grid-column:1/-1}
.locked{background:var(--band);padding:10px 12px;border-radius:5px;font-size:14px;overflow-wrap:anywhere}
.ro{opacity:.7}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .projline{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.projbtn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:60%;padding:6px 12px;border:1px solid var(--line);background:var(--field);border-radius:6px;text-align:left}

.projbtn small{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.panel[hidden]{display:none}

.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn{text-decoration:none;color:inherit;display:inline-block}

.btn.danger{background:#b3261e;color:#fff;border-color:#b3261e}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.nav.sm{width:38px;height:38px}
.wklab{text-align:center;line-height:1.2}.wklab b{font:700 18px var(--display);letter-spacing:.05em}.wklab small{display:block;color:var(--mute);font-size:13px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border:1px dashed var(--line);background:transparent;border-radius:6px;min-width:0}
.wd small{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wd b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.wd i{font-style:normal;font-size:10px;color:var(--mute);min-height:13px;white-space:nowrap}
.wd[data-has=true]{border-style:solid;background:var(--field)}
.wd[data-has=false]:not(:disabled) i{color:var(--accent);font-weight:700;font-size:14px}
.wd[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wd[aria-pressed=true] small,.wd[aria-pressed=true] i{color:var(--bg)}
.wd:disabled{opacity:.35}
.mkweek{margin-top:8px}
.dictrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.dictrow .hint{margin:0}
.dayid.big{padding:10px 16px;text-align:center;border-top:1px solid var(--line)}
.dayid .nr{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ck{font:700 15px var(--body);letter-spacing:0;text-transform:none;margin-left:4px}
.ck.saved{color:var(--ok)}.ck.saving{color:var(--mute)}.ck.error{color:#b3261e}
.saveind{font:600 13px var(--body);letter-spacing:0;text-transform:none;margin-left:6px;vertical-align:middle}
.saveind.saved{color:var(--ok)}.saveind.saving{color:var(--mute)}.saveind.error{color:#b3261e}
.donebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.donebar div{min-width:0}.donebar small{display:block;color:var(--mute);font-size:13px}
.donebar[data-done=true]{background:var(--band)}
.donetag{color:var(--ok);font-weight:700}.opentag{color:var(--warn);font-size:12px;font-weight:600}
.warn{color:var(--warn);font-size:14px;margin:10px 0 0}
.panel .box.wide{max-width:900px;height:94%;max-height:94%}
.pvhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pvpages{display:flex;flex-direction:column;gap:14px;background:var(--band);padding:12px;border-radius:6px}

.pvfoot{position:sticky;bottom:0;z-index:3;background:var(--paper);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom));margin:8px 0 0;display:flex;gap:8px}

.pvpage canvas{width:100%;max-width:794px;height:auto;aspect-ratio:210/297;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.pvpage small{color:var(--mute)}
@media (max-width:700px){.panel:has(.box.wide){padding:0;height:100vh;height:100dvh;inset:auto;top:0;left:0;right:0}.panel .box.wide{border-radius:0;height:100%;max-height:100%;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:0;border-left:0;border-right:0}.pvpages{padding:2px;gap:10px}.pvpage canvas{max-width:100%}}
.pers tfoot th{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:6px 4px 0}
.pers td.rs,.pers td.cs{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;min-width:44px}
.pers td.cs{border-top:1px solid var(--line);padding-top:6px}
.pitem .edithint{color:var(--accent);margin-top:2px}
.sigbox{display:flex;align-items:center;justify-content:center;width:100%;height:84px;margin-top:6px;border:1px dashed var(--line);border-radius:6px;background:#fff;color:#6b7478;font-size:14px;padding:2px}
.sigbox img{max-width:100%;max-height:100%;object-fit:contain}
.sigpad{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none;display:block}
.sign .ln{margin-top:4px}
.syncrow{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.syncrow label{display:flex;gap:10px;align-items:flex-start;font-size:14px}

.holiday{color:var(--warn)}
input[type=date],input[type=time]{width:100%;max-width:100%;min-height:44px;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.offday{background:var(--band);font-size:14px}
.wd[data-off=true]:not([aria-pressed=true]){background:var(--band)}
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select,[contenteditable=true]{font-weight:800!important;-webkit-text-stroke:.2px currentColor}
input::placeholder,textarea::placeholder{font-weight:400}
#t_text,#tq_text,#vf_text,#o_text,#oq_text{font-size:20px!important;line-height:1.5!important}
.trl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.trl>span{font-size:13px;font-weight:600;margin-right:4px}
.trout{margin-top:10px}.trout .tb{margin-top:8px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit;font-size:20px;line-height:1.5;font-weight:700;white-space:pre-wrap}.trout .tb small{display:block;font-size:13px;font-weight:700;margin-bottom:4px;opacity:.8}
.trl button.on{background:#1b7a3a;border-color:#1b7a3a;color:#fff}.trl button.on::before{content:'\2713  '}
.aeg{border:1px solid var(--line);border-radius:6px;background:var(--field);padding:10px 12px;margin-bottom:12px}.aeg textarea.big{font-size:18px;line-height:1.45;min-height:110px}
.trl button,.trl a{display:inline-block;padding:9px 13px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:15px}
</style>

  const titel=Object.values(titles).map(t=>{const has=pos.some(p=>p.nr.split('.')[0]===t.nr);return has?t:Object.assign({},t,{seiten:pageTitle.map((x,i)=>x===t.nr?i+1:0).filter(Boolean)});});
  return {titel,pos};
}
async function importFiles(files){
  const pid0=pid; const tg=impTarget||{kind:'lv'}; const db=await claude.use('db'), assets=await claude.use('assets');
  if(!db||!assets){imp={msg:'Fehler: Datenbank oder Dateispeicher nicht verfügbar',pct:0,err:true};fillBody();return;}
  try{
    setProg('PDF-Modul wird geladen …',1);const lib=await T(loadPdfJs(),40000,'PDF-Modul laden'); skipOcr=false; const teile=[], texts=[]; let off=0, ocrNeeded=false;
    for(let fi=0;fi<files.length;fi++){
      const f=files[fi], tag=files.length>1?`Datei ${fi+1}/${files.length}: `:'';
      setProg(tag+'PDF wird gelesen …',2); const buf=await f.arrayBuffer();
      const pdf=await T(lib.getDocument({data:buf.slice(0)}).promise,90000,'PDF öffnen'); const n=pdf.numPages;
      const parts=await splitFile(f,n,m=>setProg(tag+m,5));
      for(let i=0;i<parts.length;i++){setProg(`${tag}Teil ${i+1} von ${parts.length} wird gespeichert …`,10+Math.round(20*(i/parts.length)));const r=await uploadPart(assets,parts[i].blob);teile.push({id:r.id,von:off+parts[i].a+1,bis:off+parts[i].b});}
      let chars=0; for(let p=1;p<=n;p++){setProg(`${tag}Text wird gelesen: Seite ${p} von ${n}`,30+Math.round(15*p/n));const pg=await pdf.getPage(p);const t=await pageLines(pg);chars+=t.length;texts[off+p-1]=t;}
      if(chars/n<80){ocrNeeded=true;f._pdf=pdf;f._off=off;f._n=n;}
      off+=n;
    }
    let ocrFail='';
    if(ocrNeeded){
      let w=null; try{setProg('Texterkennung wird vorbereitet (einmalig, kann etwas dauern) …',46,true);w=await T(getOcr(),45000,'Texterkennung laden');}catch(e){console.error(e);ocrFail=(e&&e.message)||'Texterkennung nicht verfügbar';}
      if(w){
        for(const f of files){ if(!f._pdf) continue;
          for(let p=1;p<=f._n&&!skipOcr&&!ocrFail;p++){
            setProg(`Texterkennung: Seite ${f._off+p} von ${off}`,46+Math.round(48*(f._off+p)/off),true);
            const pg=await f._pdf.getPage(p),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:1700/v0.width});
            const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
            try{const r=await T(w.recognize(c),120000,'Texterkennung Seite '+(f._off+p)); texts[f._off+p-1]=(r&&r.data&&r.data.text)||'';}catch(e){console.error(e);ocrFail=(e&&e.message)||'Texterkennung abgebrochen';} c.width=0;
          }
        }
        try{await T(w.terminate(),5000,'x');}catch(e){}
      }
    }
    setProg('Positionen werden erkannt und gespeichert …',95);
    for(let i=0;i<off;i++) if(texts[i]==null) texts[i]='';
    let res=parseLV(texts); if(tg.kind==='nt'){ const r2=parseNT(texts); if(r2.pos.length) res=r2; } const base='projekte/'+pid0+(tg.kind==='lv'?'/lv':'/nt'), pre=tg.kind==='lv'?'':tg.id+'_';
    const old=await db.collection(base).get(); for(const d of old.docs){ if(d.id.startsWith(pre)) await db.doc(base+'/'+d.id).delete(); }
    await db.doc(base+'/'+pre+'meta').set({name:ntName(tg.name,texts),titel:res.titel,teile,seiten:off,quelle:'Import '+new Date().toLocaleDateString('de-DE')+(ocrNeeded?' (Texterkennung)':''),hinweis:ocrFail&&ocrFail!=='übersprungen'?'Texterkennung nicht möglich: '+ocrFail:(skipOcr?'Texterkennung übersprungen':'')});
    const byT={}; res.pos.forEach(p=>(byT[p.nr.split('.')[0]]=byT[p.nr.split('.')[0]]||[]).push(p));
    for(const k of Object.keys(byT)){const arr=byT[k];for(let i=0;i<arr.length;i+=40)await db.doc(base+'/'+pre+'pos'+k+'_'+String(i/40).padStart(2,'0')).set({pos:arr.slice(i,i+40)});}
    for(let i=0;i<off;i+=10) await db.doc(base+'/'+pre+'seiten'+String(i/10+1).padStart(2,'0')).set({von:i+1,seiten:texts.slice(i,i+10)});
    if(tg.kind==='nt') srcSel=tg.id; imp=null; data=null; view='p'; searchOn=false; q=''; tf=''; scr.p=0; scr.d=0; load(pid0); draw();
    if(skipOcr&&!ocrFail) ocrFail='übersprungen'; if(ocrFail) setTimeout(()=>{const b=$('#lvBody');if(b)b.insertAdjacentHTML('afterbegin','<p class="hint" style="padding:6px 0">Die Seiten wurden gespeichert (Original-Scan lesbar). Die Texterkennung war nicht möglich ('+esc(ocrFail)+'), daher gibt es noch keine Positionssuche.</p>');},600);
    else if(!res.pos.length) setTimeout(()=>{const b=$('#lvBody');if(b)b.insertAdjacentHTML('afterbegin','<p class="hint" style="padding:6px 0">Es wurden keine Positionen erkannt. Der Seitentext ist durchsuchbar, der Original-Scan lesbar.</p>');},600);
  }catch(e){console.error(e);imp={msg:'Fehler beim Einlesen: '+((e&&(e.code||e.message))||e),pct:0,err:true};fillBody();}
}

/* ---- Aufbau ---- */
function fillBody(){
  const body=$('#lvBody'); if(!body) return;
  body.classList.toggle('scan',view==='d'&&!imp&&!impAsk); body.dataset.err='';
  if(imp){body.innerHTML=`<div style="padding:24px 8px;text-align:center"><p style="font-size:16px;margin:0 0 12px">${esc(imp.msg)}</p>${imp.err?'<button type="button" class="btn" data-impclose="1">Schließen</button>':`<div style="height:10px;border-radius:6px;background:var(--band);overflow:hidden"><div style="height:100%;width:${imp.pct||0}%;background:var(--accent)"></div></div><p class="hint">Schritt läuft seit ${Math.round((Date.now()-(imp.t0||Date.now()))/1000)} s. Bitte dieses Fenster geöffnet lassen.</p>${imp.ocr?'<button type="button" class="btn" data-impskip="1">Texterkennung überspringen und speichern</button>':''}`}</div>`;return;}
  if(impAsk){body.innerHTML='<div style="padding:20px 8px;text-align:center"><p style="font-size:16px;margin:0 0 12px">Das vorhandene Leistungsverzeichnis dieser Baustelle wird durch die neue Datei ersetzt.</p><div class="prow" style="justify-content:center"><button type="button" class="btn primary" data-impgo="1">Ersetzen – Datei wählen</button><button type="button" class="btn" data-impno="1">Abbrechen</button></div></div>';return;}
  if(ntAsk){body.innerHTML='<div style="padding:20px 8px"><p style="font-size:16px;margin:0 0 10px">Nachtrag einlesen: Bezeichnung eingeben, dann die PDF-Datei wählen. Die Positionen des Nachtrags erscheinen danach einzeln im Aufmaßblatt.</p><input type="text" id="ntName" placeholder="z. B. Nachtrag 02 Betonabbruch" style="margin-bottom:12px"><div class="prow" style="margin-top:0"><button type="button" class="btn primary" data-ntgo="1">Datei wählen</button><button type="button" class="btn" data-ntno="1">Abbrechen</button></div></div>';return;}
  if(loading||!data){body.innerHTML='<p class="hint">Leistungsverzeichnis wird geladen …</p>';return;}
  if(data.fehler){body.innerHTML='<p class="hint">Fehler beim Laden: '+esc(data.fehler)+'</p>';return;}
  if(data.leer){body.innerHTML='<p class="hint" style="padding:16px 4px">Für diese Baustelle ist noch kein Leistungsverzeichnis eingelesen. Oben auf „📁 Einlesen“ tippen und das PDF aus der Dateien-App wählen. Gescannte PDFs werden per Texterkennung ausgelesen (dauert einige Minuten), PDFs über 20 MB automatisch zerlegt.</p>';return;}
  if(view==='d'){body.innerHTML=scanHtml();startScan(body);body.scrollTop=scr.d;}
  else{body.innerHTML=searchOn?searchHtml():readHtml();body.scrollTop=(searchOn&&q.trim())?0:scr.p;}
}
function chipsHtml(){
  if(!data||!data.meta||view==='d') return '';
  const ts=titles(); const jump=!(searchOn&&q.trim());
  return (jump?'':`<button type="button" data-t="" aria-pressed="${tf===''}">Alle</button>`)+ts.filter(t=>jump||data.pos.some(p=>p.nr.split('.')[0]===t.nr)).map(t=>`<button type="button" data-${jump?'jump':'t'}="${esc(t.nr)}" aria-pressed="${!jump&&tf===t.nr}">${esc(t.nr)} ${esc(t.text)}</button>`).join('');
}
function draw(){
  const main=$('#main'); if(!main) return;
  const p=lsGet(LSA)||'p1'; if(p!==pid){pid=p;data=null;loading=false;srcSel='lv';ntList=[];}
  if(!data&&!loading) load(p);
  const chipBtn=k=>`<button class="btn small ${k===DKLV?'primary':''}" data-dkkat="${esc(k)}" type="button" style="white-space:nowrap;flex:none">${esc(k)}</button>`;
  main.innerHTML=`<div class="sheet"><div class="sec"><div class="prow" style="margin:0;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch"><button class="btn small" data-dkkat="" type="button" style="white-space:nowrap;flex:none">← Dokumente</button>${kats.map(chipBtn).join('')}</div></div>

  <div class="lvsearch"${searchOn&&view==='p'?'':' hidden'}><input type="search" id="lvQ" placeholder="Position (z. B. 04.23) oder Wort suchen" autocomplete="off" enterkeyhint="search" value="${esc(q)}"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nc=c=>{c=c.toLowerCase();if(c==='ä')return'a';if(c==='ö')return'o';if(c==='ü')return'u';if(c==='ß')return's';const d=c.normalize('NFD')[0];return d||c;};
const norm=s=>{s=String(s||'');let r='';for(let i=0;i<s.length;i++)r+=nc(s[i]);return r;};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=k=>{if(!k)return'';const [y,m,d]=k.split('-');return d+'.'+m+'.'+y;};
const TYP={ein:'E-Mail Eingang',aus:'E-Mail Ausgang',brief:'Brief / Schreiben',sonst:'Sonstiges'};
let pid=null,info={},items=new Map(),unsub=null,view='list',cur=null,q='',filt='',msg='',db=null,assets=null,tmr={};
function path(){return 'projekte/'+pid+'/schriftverkehr';}
async function ensureDb(){ if(!db) db=await claude.use('db'); return db; }
async function sub(){
  if(unsub){try{unsub();}catch(e){}unsub=null;} items=new Map();
  const d=await ensureDb(); if(!d){msg='Datenbank nicht verfügbar';paint();return;}
  const p=pid;
  unsub=d.collection(path()).onSnapshot(s=>{ if(p!==pid)return; items=new Map(s.docs.map(x=>[x.id,JSON.parse(JSON.stringify(x.data()))])); const f=document.querySelector('#svRoot :focus'); if(!f) paint(); },e=>{console.error(e);msg='Fehler beim Laden';paint();});
}

const newId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function listHtml(){
  const terms=norm(q).trim().split(/\s+/).filter(Boolean);
  let arr=[...items.values()].filter(x=>!filt||x.typ===filt).filter(x=>{const n=norm([x.betreff,x.von,x.an,x.text,x.notiz,(x.dateien||[]).map(f=>f.name).join(' ')].join(' '));return terms.every(w=>n.indexOf(w)>=0);});

  return `<div class="sheet" id="svRoot"><div class="sec"><h2>Schriftverkehr${info.baustelle?' – '+esc(info.baustelle):''}</h2>

    <p class="hint" style="margin:6px 0 0">E-Mails als .eml-Datei einlesen (Betreff, Absender, Datum, Text und Anhänge), E-Mails als PDF/Datei anhängen oder den Text einfach einfügen.</p>
    <div id="svMsg">${esc(msg)}</div>
    <input type="search" id="svQ" placeholder="Suchen in Betreff, Absender, Text …" value="${esc(q)}" style="margin-top:10px" autocomplete="off">
    <div class="svchips">${chips}</div></div>
    <div class="sec">${arr.length?arr.map(x=>`<button type="button" class="svc" data-open="${esc(x.id)}"><span class="svt">${esc(TYP[x.typ]||'')} · ${esc(fmt(x.datum))}</span><b>${esc(x.betreff||'(ohne Betreff)')}</b><small>${esc([x.von&&('Von: '+x.von),x.an&&('An: '+x.an)].filter(Boolean).join('  ·  '))}${(x.dateien||[]).length?'  ·  📎 '+(x.dateien||[]).length:''}</small></button>`).join(''):'<p class="hint" style="margin:0">'+(items.size?'Keine Treffer.':'Noch kein Schriftverkehr für diese Baustelle.')+'</p>'}</div></div>`;
}
function detailHtml(){

    ${f('datum','Datum','','date')}${f('betreff','Betreff','')}${f('von','Von','Absender')}${f('an','An','Empfänger (auch Cc)')}

    <label for="sv_notiz">Notiz (intern)</label><textarea id="sv_notiz" data-k="notiz" style="min-height:70px">${esc(x.notiz||'')}</textarea></div>
  <div class="sec"><h2>Anhänge</h2>${(x.dateien||[]).map((a,i)=>`<div class="svatt"><a href="/_blob/${esc(a.id)}" target="_blank" rel="noopener">📎 ${esc(a.name)}</a><button type="button" data-rm="${i}" aria-label="Anhang entfernen">×</button></div>`).join('')||'<p class="hint" style="margin:0 0 6px">Keine Anhänge.</p>'}
    <div class="svbar"><label class="btn" for="svAtt" style="cursor:pointer">📁 Datei anhängen</label><input type="file" id="svAtt" multiple style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true"></div><div id="svMsg">${esc(msg)}</div></div>
  <div class="sec"><button class="btn danger" type="button" id="svDel">Eintrag löschen</button></div></div>`;
}
function paint(){ const m=$('#main'); if(!m||!window.__svOn) return; m.innerHTML=view==='detail'?detailHtml():listHtml(); }
/* ---- E-Mail-Dateien lesen ---- */
const bin2str=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return s;};
const str2u8=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u;};
function decBytes(u8,cs){cs=(cs||'utf-8').toLowerCase().replace(/^"|"$/g,'');try{return new TextDecoder(cs==='us-ascii'?'utf-8':cs).decode(u8);}catch(e){return new TextDecoder('utf-8').decode(u8);}}
function qpBytes(s){s=s.replace(/=\r?\n/g,'');const out=[];for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9A-Fa-f]{2}$/.test(s.substr(i+1,2))){out.push(parseInt(s.substr(i+1,2),16));i+=2;}else out.push(s.charCodeAt(i)&255);}return new Uint8Array(out);}
function b64Bytes(s){try{return str2u8(atob(s.replace(/[^A-Za-z0-9+/=]/g,'')));}catch(e){return new Uint8Array(0);}}
function decWord(h){return String(h||'').replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,(m,cs,e,t)=>decBytes(e.toLowerCase()==='b'?b64Bytes(t):qpBytes(t.replace(/_/g,' ')),cs)).replace(/\?=\s+=\?/g,'');}
function parseHead(h){const o={};h.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i>0){const k=l.slice(0,i).trim().toLowerCase();if(!(k in o))o[k]=l.slice(i+1).trim();}});return o;}
const param=(v,n)=>{const m=String(v||'').match(new RegExp(n+'\\*?=\\s*(?:"([^"]*)"|([^;\\s]+))','i'));return m?(m[1]!==undefined?m[1]:m[2]):'';};
function parsePart(raw,out){
  const i=raw.search(/\r?\n\r?\n/); const head=i<0?raw:raw.slice(0,i), body=i<0?'':raw.slice(i).replace(/^\r?\n\r?\n/,'');
  const h=parseHead(head), ct=(h['content-type']||'text/plain').toLowerCase(), cte=(h['content-transfer-encoding']||'').toLowerCase();
  if(ct.startsWith('multipart/')){ const b=param(h['content-type'],'boundary'); if(!b) return h;
    body.split('--'+b).slice(1).forEach(p=>{ if(/^--/.test(p))return; parsePart(p.replace(/^\r?\n/,''),out); }); return h; }
  const bytes=cte==='base64'?b64Bytes(body):cte==='quoted-printable'?qpBytes(body):str2u8(body);
  const disp=(h['content-disposition']||'').toLowerCase(), fn=decWord(param(h['content-disposition'],'filename')||param(h['content-type'],'name'));
  if(ct.startsWith('message/rfc822')&&!fn){ parsePart(bin2str(bytes),out); return h; }
  if((disp.startsWith('attachment')||fn)&&!ct.startsWith('text/plain')||(fn&&disp.startsWith('attachment'))) out.att.push({name:fn||'Anhang',type:ct.split(';')[0].trim(),bytes});
  else if(ct.startsWith('text/plain')) out.plain.push(decBytes(bytes,param(h['content-type'],'charset')));
  else if(ct.startsWith('text/html')) out.html.push(decBytes(bytes,param(h['content-type'],'charset')));
  return h;
}
const html2txt=s=>s.replace(/<(style|script)[\s\S]*?<\/\1>/gi,'').replace(/<br\s*\/?>|<\/p>|<\/div>|<\/tr>|<\/li>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\n{3,}/g,'\n\n').trim();
function parseEml(u8){
  const raw=bin2str(u8), out={plain:[],html:[],att:[]}, i=raw.search(/\r?\n\r?\n/), head=parseHead(i<0?raw:raw.slice(0,i));
  parsePart(raw,out);
  const text=(out.plain.join('\n\n').trim())||html2txt(out.html.join('\n'));
  let d=''; try{const dd=new Date(head['date']);if(!isNaN(dd))d=dkey(dd);}catch(e){}
  return {betreff:decWord(head['subject']),von:decWord(head['from']),an:decWord([head['to'],head['cc']].filter(Boolean).join(', ')),datum:d,text,att:out.att};
}
async function getAssets(){ if(!assets) assets=await claude.use('assets'); return assets; }
async function upload(blob,type){ const a=await getAssets(); if(!a) throw new Error('Dateispeicher nicht verfügbar'); const up=()=>Promise.race([a.upload(blob,{type}),new Promise((_,r)=>setTimeout(()=>r(new Error('Upload: keine Antwort')),120000))]); try{return await up();}catch(e){if(e&&e.code==='store_unavailable'){await new Promise(r=>setTimeout(r,1200));return await up();}throw e;} }
const OKT=/^(image\/|application\/pdf|text\/|application\/json|font\/|video\/)/;
async function importEml(files){
  const d=await ensureDb(); let ok=0,notes=[]; 
  for(let i=0;i<files.length;i++){
    msg=`E-Mail ${i+1} von ${files.length} wird eingelesen …`; const m=$('#svMsg'); if(m)m.textContent=msg;
    try{
      const u8=new Uint8Array(await files[i].arrayBuffer()), e=parseEml(u8); const id=newId();
      const typ=/awr-abbruch|fjd1967/i.test(e.von)?'aus':'ein';
      const it={id,typ,datum:e.datum||dkey(new Date()),betreff:e.betreff||files[i].name.replace(/\.eml$/i,''),von:e.von,an:e.an,text:e.text,notiz:'',dateien:[],angelegt:new Date().toISOString()};
      for(const a of e.att){ if(!OKT.test(a.type)||a.bytes.length>19*1048576){notes.push(`Anhang „${a.name}“ (${a.type}) nicht übernommen`);continue;} try{const r=await upload(new Blob([a.bytes],{type:a.type}),a.type);it.dateien.push({id:r.id,name:a.name,typ:a.type});}catch(er){notes.push(`Anhang „${a.name}“: ${(er&&(er.code||er.message))||er}`);} }
      try{const r=await upload(new Blob([u8],{type:'text/plain'}),'text/plain');it.dateien.push({id:r.id,name:files[i].name,typ:'eml'});}catch(er){}
      await d.doc(path()+'/'+id).set(it); items.set(id,it); ok++;
    }catch(er){console.error(er);notes.push(`${files[i].name}: ${(er&&(er.code||er.message))||er}`);}
  }
  msg=(ok?`✓ ${ok} E-Mail${ok>1?'s':''} eingelesen.`:'Keine E-Mail eingelesen.')+(notes.length?'\n'+notes.join('\n'):''); paint();
}
async function addFiles(files){
  const x=items.get(cur); if(!x)return; const keep=cur; let notes=[];
  for(let i=0;i<files.length;i++){ const m=$('#svMsg'); if(m)m.textContent=`Datei ${i+1} von ${files.length} wird hochgeladen …`;
    try{ const f=files[i]; if(f.size>19*1048576) throw new Error('größer als 20 MB'); const t=f.type||'application/octet-stream';
      if(!OKT.test(t)) throw new Error('Dateityp '+(t)+' wird nicht unterstützt (bitte als PDF speichern)');
      const r=await upload(f,t); x.dateien=[...(x.dateien||[]),{id:r.id,name:f.name,typ:t}]; save(keep);
    }catch(er){notes.push(`${files[i].name}: ${(er&&(er.code||er.message))||er}`);} }
  msg=notes.join('\n'); if(cur===keep) paint();
}
document.addEventListener('click',e=>{
  if(!window.__svOn||!$('#svRoot')) return; const t=e.target.closest('button,a'); if(!t) return;
  if(t.id==='svNew'){ const id=newId(); const it={id,typ:'ein',datum:dkey(new Date()),betreff:'',von:'',an:'',text:'',notiz:'',dateien:[],angelegt:new Date().toISOString()}; items.set(id,it); save(id); cur=id; view='detail'; msg=''; paint(); window.scrollTo(0,0); return; }
  if(t.dataset.open){ cur=t.dataset.open; view='detail'; msg=''; paint(); window.scrollTo(0,0); return; }
  if(t.id==='svBack'){ view='list'; msg=''; paint(); return; }
  if(t.dataset.f!==undefined&&t.closest('.svchips')){ filt=t.dataset.f; paint(); return; }
  if(t.dataset.rm!==undefined){ const x=items.get(cur); if(x){ x.dateien.splice(+t.dataset.rm,1); save(cur); paint(); } return; }
  if(t.id==='svDel'){ if(t.dataset.ask){ const id=cur; items.delete(id); view='list'; paint(); ensureDb().then(d=>bpDel(d, path()+'/'+id)).catch(er=>console.error(er)); } else { t.dataset.ask='1'; t.textContent='Wirklich löschen? Nochmal tippen'; } return; }
});
document.addEventListener('input',e=>{
  if(!window.__svOn||!$('#svRoot')) return; const el=e.target;
  if(el.id==='svQ'){ q=el.value; const m=$('#main'); const keep=el.selectionStart; paint(); const n=$('#svQ'); if(n){n.focus();try{n.setSelectionRange(keep,keep);}catch(_){}} return; }
  if(el.dataset&&el.dataset.k&&view==='detail'){ const x=items.get(cur); if(x){ x[el.dataset.k]=el.value; save(cur); } }
});
document.addEventListener('change',e=>{
  if(!window.__svOn||!$('#svRoot')) return; const el=e.target;
  if(el.id==='svEml'){ const fs=[...el.files]; el.value=''; if(fs.length) importEml(fs); return; }
  if(el.id==='svAtt'){ const fs=[...el.files]; el.value=''; if(fs.length) addFiles(fs); return; }
  if(el.dataset&&el.dataset.k==='typ'){ const x=items.get(cur); if(x){ x.typ=el.value; save(cur); } }
});
window.__sv={ render(p,s){ window.__svOn=true; if(p!==pid){ pid=p; info=s||{}; view='list'; cur=null; q=''; filt=''; msg=''; sub(); } else info=s||info; paint(); }, leave(){ window.__svOn=false; } };
})();
</script>

<style>

.anitem small{display:block;color:var(--mute)}
.anf label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
.anf input,.anf textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit}

.anbadge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);margin-left:6px}
</style>
<script>
(function(){

const FI={name:__F.name,strasse:__F.strasse,ort:(__F.plz+' '+__F.ort).trim(),tel:__F.tel};
let pid=null,info={},items=new Map(),unsub=null,view='list',cur=null,msg='',db=null,tmr={},vitems=new Map(),vunsub=null;
const path=()=>'projekte/'+pid+'/anfragen';
const vpath=()=>'projekte/'+pid+'/vergleiche';
const fd=k=>{if(!k)return'';const a=String(k).split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:k;};
async function ensureDb(){ if(!db) db=await claude.use('db'); return db; }
async function sub(){
  if(unsub){try{unsub();}catch(e){}unsub=null;} items=new Map();
  const d=await ensureDb(); if(!d){msg='Datenbank nicht verfügbar';paint();return;}
  const p=pid;
  unsub=d.collection(path()).onSnapshot(s=>{ if(p!==pid)return; items=new Map(s.docs.map(x=>[x.id,JSON.parse(JSON.stringify(x.data()))])); const f=document.querySelector('#anRoot :focus'); if(!f) paint(); },e=>{console.error(e);msg='Fehler beim Laden';paint();});
  if(vunsub){try{vunsub();}catch(e){}vunsub=null;} vitems=new Map();
  vunsub=d.collection(vpath()).onSnapshot(s=>{ if(p!==pid)return; vitems=new Map(s.docs.map(x=>[x.id,JSON.parse(JSON.stringify(x.data()))])); const f=document.querySelector('#anRoot :focus'); if(!f) paint(); },e=>{console.error(e);});
}
function vsave(id){ clearTimeout(tmr['v'+id]); tmr['v'+id]=setTimeout(async()=>{ const it=vitems.get(id); if(!it)return; try{ const d=await ensureDb(); await d.doc(vpath()+'/'+id).set(it); const i=$('#anSaved'); if(i){i.textContent='✓ Gespeichert';setTimeout(()=>{const j=$('#anSaved'); if(j)j.textContent='';},1500);} }catch(e){ console.error(e); const i=$('#anSaved'); if(i)i.textContent='Speichern fehlgeschlagen'; } },600); }
function save(id){ clearTimeout(tmr[id]); tmr[id]=setTimeout(async()=>{ const it=items.get(id); if(!it)return; try{ const d=await ensureDb(); await d.doc(path()+'/'+id).set(it); const i=$('#anSaved'); if(i){i.textContent='✓ Gespeichert';setTimeout(()=>{const j=$('#anSaved'); if(j)j.textContent='';},1500);} }catch(e){ console.error(e); const i=$('#anSaved'); if(i)i.textContent='Speichern fehlgeschlagen'; } },600); }
const newId=()=>'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function head(){ return 'Anfragen'+(info.baustelle?' – '+esc(String(info.baustelle).trim()):''); }
function listHtml(){
  const arr=[...items.values()].map((x,i)=>x).sort((a,b)=>(a.nr||0)-(b.nr||0));
  const ids=[...items.entries()].sort((a,b)=>(a[1].nr||0)-(b[1].nr||0));
  return `<div class="sheet" id="anRoot"><div class="sec"><h2>${head()}</h2>
  <p class="hint">Positionen aus dem LV als Anfrage an Nachunternehmer / Lieferanten – als PDF oder direkt per E-Mail.</p>
  <div class="anrow"><button class="btn primary" type="button" data-an="new">+ Neue Anfrage</button></div>${msg?`<p class="hint">${esc(msg)}</p>`:''}
  ${ids.length?ids.map(([id,x])=>`<button type="button" class="anitem" data-an="open" data-id="${esc(id)}"><b>Anfrage ${esc(x.nr||'')} – ${esc(x.titel||'ohne Titel')}</b>${x.status==='gesendet'?'<span class="anbadge">gesendet '+esc(fd(x.gesendetAm))+'</span>':'<span class="anbadge">Entwurf</span>'}<small>${(x.positionen||[]).length} Position(en)${x.empfaenger?' · an '+esc(x.empfaenger):''}</small></button>`).join(''):'<p class="hint">Noch keine Anfragen.</p>'}
  ${vitems.size?`<h2 style="margin-top:22px">Vergleiche und Auswertungen</h2><p class="hint">Preisspiegel, Rückantworten und Anfragestatus zum Versenden.</p>`+[...vitems.entries()].sort((a,b)=>(a[1].nr||0)-(b[1].nr||0)).map(([id,x])=>`<button type="button" class="anitem" data-an="vopen" data-id="${esc(id)}"><b>${esc(x.titel||'Vergleich')}</b>${x.status==='gesendet'?'<span class="anbadge">gesendet '+esc(fd(x.gesendetAm))+'</span>':'<span class="anbadge">Entwurf</span>'}<small>${(x.bloecke||[]).length} Tabelle(n) · Stand ${esc(fd(x.stand))}${x.empfaenger?' · an '+esc(x.empfaenger):''}</small></button>`).join(''):''}
  </div></div>`;
}
function vTable(b){ const bold=new Set(b.fett||[]); return `<div class="vblk"><h3>${esc(b.titel)}</h3><div class="vwrap"><table class="vtab"><thead><tr>${(b.spalten||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${(b.zeilen||[]).map((r,i)=>`<tr${bold.has(i)?' class="vb"':''}>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${b.hinweis?`<p class="hint">${esc(b.hinweis)}</p>`:''}</div>`; }
function vEditHtml(){
  const x=vitems.get(cur); if(!x) return listHtml();
  return `<div class="sheet anf" id="anRoot"><div class="sec"><div class="anrow"><button class="btn" type="button" data-an="back">← Anfragen</button><span id="anSaved" class="hint" style="margin:0"></span></div>
  <h2>${esc(x.titel||'Vergleich')}</h2><p class="hint">${esc(String(info.baustelle||'').trim())} · Stand ${esc(fd(x.stand))}</p>${msg?`<p class="hint" id="anMsg">${esc(msg)}</p>`:'<p class="hint" id="anMsg"></p>'}
  ${(x.bloecke||[]).map(vTable).join('')}

  ${(x.angebote||[]).map((a,i)=>`<div class="anpos"><div class="anrow"><b style="flex:1 1 160px;word-break:break-word">${esc(a.name)}</b><input data-vaf="firma" data-i="${i}" placeholder="Firma" value="${esc(a.firma||'')}" style="flex:1 1 120px;width:auto"><small class="hint" style="margin:0">${Math.round((a.size||0)/1024)} KB</small><button class="btn small" type="button" data-an="vadel" data-i="${i}">Entfernen</button></div></div>`).join('')||'<p class="hint">Noch keine Angebote angehängt.</p>'}
  <div class="anrow"><button class="btn" type="button" data-an="vaadd">+ Angebot hinzufügen</button><input type="file" id="vaFile" accept="application/pdf,image/*" multiple style="display:none"></div>

  <div class="anrow" style="margin-top:14px"><button class="btn" type="button" data-an="vpdf">PDF speichern</button><button class="btn primary" type="button" data-an="vsend">Per E-Mail senden</button></div>

  <div class="anrow"><button class="btn danger small" type="button" data-an="vdel">Vergleich löschen</button></div></div></div>`;
}
function posHtml(p,i){
  return `<div class="anpos"><div class="anrow"><b>Pos. ${i+1}</b><button class="btn small" type="button" data-an="delpos" data-i="${i}" style="margin-left:auto">Entfernen</button></div>

  const x=items.get(cur); if(!x) return listHtml();
  return `<div class="sheet anf" id="anRoot"><div class="sec"><div class="anrow"><button class="btn" type="button" data-an="back">← Anfragen</button><span id="anSaved" class="hint" style="margin:0"></span></div>

function paint(){ const m=$('#main'); if(!m||!window.__anOn) return; m.innerHTML = view==='edit'?editHtml():view==='vedit'?vEditHtml():listHtml(); }
const vn=s=>String(s==null?'':s);

function vBuildPdf(x){

    y+=6;
  });
  return d;
}

  d.setFont('helvetica','bold'); d.setFontSize(11); d.text(FI.name,M,y); d.setFont('helvetica','normal'); d.setFontSize(9); d.text(FI.strasse+', '+FI.ort+' · Tel. '+FI.tel,M,y+5); y+=14;

  txt(x.anrede,10,false,2); if(x.einleitung) txt(x.einleitung,10,false,4);

    txt('Pos. '+(p.nr||'')+'   '+(p.kurz||''),10,true,2);
    String(p.text||'').split('\n').forEach(par=>{ const m=par.match(/^([A-Za-zÄÖÜäöüß \/\-]{3,30}):\s*(.*)$/); if(m){ need(6); d.setFont('helvetica','bold'); d.setFontSize(9.5); const lab=m[1]+': '; d.text(lab,M,y); const lw=d.getTextWidth(lab); d.setFont('helvetica','normal'); const ls=d.splitTextToSize(m[2],TW-lw); if(ls.length){ d.text(ls[0],M+lw,y); y+=4.4; ls.slice(1).forEach(l=>{ const rest=d.splitTextToSize(l,TW); need(5); d.text(l,M,y); y+=4.4; }); } else y+=4.4; y+=0.8; } else txt(par,9.5,false,0.8); });
    y+=1; need(10); d.setFont('helvetica','bold'); d.setFontSize(10); d.text('Menge: '+(p.menge||'')+' '+(p.einheit||''),M,y); d.setFont('helvetica','normal'); d.text('EP (EUR netto): ____________',M+62,y); d.text('GP (EUR netto): ____________',M+120,y); y+=9;

  return d;
}

async function gmailSend(to,subject,body,atts,setMsg,html){
  const mcp=await Promise.race([claude.use('mcp'),new Promise((_,r)=>setTimeout(()=>r({code:'no_mcp'}),15000))]); if(!mcp) throw {code:'no_mcp'};
  try{ const pm=await Promise.race([claude.use('permissions'),new Promise(r=>setTimeout(()=>r(null),5000))]);
    if(pm){ let perm=await pm.state('mcp:Gmail').catch(()=>'unavailable');
      if(perm==='prompt'){ setMsg('Gmail-Freigabe wird abgefragt – bitte „Erlauben“ wählen …'); const r=await Promise.race([pm.request(['mcp:Gmail']),new Promise(r=>setTimeout(()=>r(null),60000))]).catch(()=>null); perm=(r&&r['mcp:Gmail'])||await pm.state('mcp:Gmail').catch(()=>'unavailable'); }
      if(perm==='denied') throw {code:'approval_required'}; }
  }catch(e){ if(e&&e.code) throw e; }
  setMsg('E-Mail wird gesendet …');
  await Promise.race([mcp.callTool('Gmail','send_message',Object.assign({to,subject,body},html?{htmlBody:html}:{},atts&&atts.length?{attachments:atts}:{}),{cache:false}),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout',message:'keine Antwort nach 60 s'}),60000))]);
}

<script>
/* Papierkorb: jede Löschung legt vorher eine Kopie unter papierkorb/ ab – so geht nichts verloren. Schlägt die Sicherung fehl, wird NICHT gelöscht. */
window.bpDel = async function(db, path){
  if(!/\/fotos\//.test(path)){
    let snap = null; try{ snap = await db.doc(path).get(); }catch(e){ console.error(e); throw e; }
    if(snap && snap.exists){
      const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await db.doc('papierkorb/'+id).set({pfad:path, daten:JSON.stringify(snap.data()), geloescht:new Date().toISOString()});
    }
  }
  return db.doc(path).delete();
};

function isoWeek(k){
  const d = parseKey(k); const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate()+4-day);

function easter(y){

        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;

function holidaysBW(y){
  if(_hol.has(y)) return _hol.get(y);

function queue(id, fn){
  const now = Date.now(); const a = wlog[id] = (wlog[id]||[]).filter(t=>now-t < 10000); a.push(now);
  if(a.length > 15){ toast('Zu viele Schreibvorgänge, Speichern gestoppt. Bitte neu laden.', 5000); return Promise.resolve(false); }
  chains[id] = (chains[id] || Promise.resolve()).then(fn).then(()=>true, e=>{ console.error(e); toast('Speichern fehlgeschlagen'+(e&&(e.code||e.message)?' ('+(e.code||e.message)+')':''), 5000); return false; });
  return chains[id];
}
/* Häkchen: ✓ = gespeichert, … = wird gespeichert, ! = nicht gespeichert */
const ck = new Map();
function paintChecks(){
  document.querySelectorAll('[data-ck]').forEach(el=>{
    const st = ck.get(el.dataset.ck==='settings' ? 'settings:settings' : `${cur}:${el.dataset.ck}`) || '';
    el.className = 'ck '+st; el.textContent = st==='saving'?'…':st==='saved'?'✓':st==='error'?'!':'';
    el.title = st==='saved'?'Gespeichert':st==='saving'?'Wird gespeichert':st==='error'?'Nicht gespeichert':'';
  });
  const v = [...ck.values()]; const st = v.includes('error')?'error':v.includes('saving')?'saving':v.length?'saved':'';
  const ind = $('#saveInd'); ind.className = 'saveind '+st;
  ind.textContent = st==='saved'?'✓ Gespeichert':st==='saving'?'Speichert …':st==='error'?'! Nicht gespeichert':'';
}
function markStart(key, sec){ ck.set(key+':'+sec, 'saving'); paintChecks(); }
function markDone(key, ok){
  [...ck.keys()].forEach(k=>{ if(k.startsWith(key+':') && ck.get(k)==='saving') ck.set(k, ok?'saved':'error'); });
  paintChecks();
}
const pendingSecs = new Map();
const SEC_FIELDS = { personal:['personal'], leistungen:['leistungen'], geraete:['geraete'], ausser:['ausser'], wetter:['wetter','von','bis'], fotos:['photos'], sig:['sig'], fertig:['fertig','fertigAm'], gesendet:['gesendetAm'], tag:['nr','datum'] };
/* Nur die geänderten Bereiche schreiben und mit dem aktuellen Stand der Datenbank zusammenführen,
   damit ein Gerät mit altem Stand (z. B. ohne Fotos) nichts überschreibt. */
function persistEntry(key, pid=activeId, secs){
  const data = entries.get(key); if(!data) return Promise.resolve(true);
  if(!secs){ secs = pendingSecs.get(key); pendingSecs.delete(key); }
  const local = JSON.parse(JSON.stringify(data)); const want = [...(secs||['tag'])];
  return queue('e'+pid+key, async ()=>{
    let fresh = null;
    try{ fresh = store.getEntry ? await store.getEntry(pid, key) : null; }catch(err){ console.error(err); fresh = null; }
    if(!fresh){ await store.setEntry(pid, key, local); return; }
    const out = fresh; let any = false;
    want.forEach(sec=>{ (SEC_FIELDS[sec]||[]).forEach(f=>{ if(local[f] === undefined) delete out[f]; else out[f] = local[f]; any = true; }); });
    if(!any) return;
    await store.setEntry(pid, key, out);
  });
}
function persistSettings(pid=activeId){
  const copy = JSON.parse(JSON.stringify(settings));
  return queue('s'+pid, ()=>store.setProject(pid, copy));
}
function scheduleEntry(key, sec='tag'){
  dirty.add(key); touched.set(key, Date.now()); markStart(key, sec); (pendingSecs.get(key) || pendingSecs.set(key,new Set()).get(key)).add(sec); clearTimeout(timers[key]);
  timers[key] = setTimeout(async ()=>{ const ok = await persistEntry(key); dirty.delete(key); touched.set(key, Date.now()); markDone(key, ok); }, 600);
}
function scheduleSettings(){
  dirty.add('settings'); savedAt.set(activeId, Date.now()); markStart('settings','settings'); clearTimeout(timers.settings);
  timers.settings = setTimeout(async ()=>{ const ok = await persistSettings(); dirty.delete('settings'); savedAt.set(activeId, Date.now()); markDone('settings', ok); renderHeader(); }, 600);
}
async function flush(){
  for(const id of [...pdirty]){ clearTimeout(ptimers[id]); await persistProt(id); }
  for(const id of [...bdirty]){ clearTimeout(btimers[id]); await persistBeleg(id); }
  const keys = [...dirty];
  for(const k of keys){ clearTimeout(timers[k]); const ok = k==='settings' ? await persistSettings() : await persistEntry(k); dirty.delete(k); markDone(k, ok); }
}

const sortedKeys = () => [...entries.keys()].sort();
const aufstellerName = () => settings.aufsteller !== undefined ? String(settings.aufsteller||'') : __ME.name;
const nrTxt = e => e && e.nr ? String(e.nr) : '–';
const firstNumbered = () => sortedKeys().find(k=>parseKey(k).getDay()!==0);
const syncEnabled = () => settings.syncWeek !== false;
function lastSig(key){
  const prev = [...sortedKeys()].reverse().find(k=>k<key && entries.get(k)?.sig && Object.keys(entries.get(k).sig).length);
  return prev ? JSON.parse(JSON.stringify(entries.get(prev).sig)) : null;
}
function newEntry(key){
  const keys = sortedKeys();
  const work = isWorkday(key);
  /* Quelle: ein Werktag derselben Woche, sonst der vorherige Tag. */
  let src = null;
  if(work && syncEnabled()){
    const mates = workdaysOfWeek(key).filter(k=>entries.has(k));
    if(mates.length) src = entries.get(mates.sort((a,b)=>Math.abs(parseKey(a)-parseKey(key))-Math.abs(parseKey(b)-parseKey(key)))[0]);
  }
  if(!src){ const prevKey = [...keys].reverse().find(k => k < key); src = prevKey ? entries.get(prevKey) : null; }
  const base = src?.personal?.length ? src.personal.map(r=>({...r})) : [{firma:__F.name,bl:0,polier:0,fach:0,helfer:0,bem:''}];
  const hol = holidayName(key);
  const personal = work ? base : base.map(r=>({...r,bl:0,polier:0,fach:0,helfer:0}));
  return {
    nr:0, datum:key,
    wetter:{vorm:[],nachm:[],tVorm:'',tNachm:'',quelle:''},
    von: src?.von || '07:00', bis: src?.bis || '17:00',
    personal,

function propagate(key, field){

async function onProjects(map){

  const hot = id => projects.has(id) && ((id===activeId && dirty.has('settings')) || now-(savedAt.get(id)||0) < 8000);
  const merged = new Map();
  map.forEach((v,id)=>merged.set(id, hot(id) ? projects.get(id) : v));
  projects.forEach((v,id)=>{ if(!merged.has(id) && now-(savedAt.get(id)||0) < 20000) merged.set(id, v); });
  archProjects = new Map(); merged.forEach((v,id)=>{ if(v && v.archiviert){ archProjects.set(id,v); } }); archProjects.forEach((v,id)=>merged.delete(id));

/* Tägliches Wetter (von der geplanten Aufgabe geschrieben) in Tage übernehmen, die noch nicht von Hand geändert wurden. */
function applyWetter(){

  wetterDocs.forEach((w,k)=>{
    const e = entries.get(k); if(!e || e.wetter?.quelle==='manuell' || dirty.has(k)) return;

    const n = {vorm:w.vorm||[], nachm:w.nachm||[], tVorm:w.tVorm ?? '', tNachm:w.tNachm ?? '', quelle:'auto'};
    const ow = e.wetter || {}, same = JSON.stringify(n.vorm)===JSON.stringify(ow.vorm||[]) && JSON.stringify(n.nachm)===JSON.stringify(ow.nachm||[]) && String(n.tVorm)===String(ow.tVorm ?? '') && String(n.tNachm)===String(ow.tNachm ?? '') && ow.quelle==='auto';

  const cv = $('#sigPad'); const dpr = Math.min(2, window.devicePixelRatio||1);
  const w = cv.clientWidth || 320, h = 190; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); cv.style.height = h+'px';
  const x = cv.getContext('2d'); x.scale(dpr,dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111';

const restMsg = t => { const e = $('#restoreMsg'); if(e) e.textContent = t; else if(t) toast(t, 5000); };
async function restoreAll(file){
  const msg = restMsg; if(needAdmin()) return;
  if(!window.JSZip) return msg('ZIP-Modul nicht geladen.');
  if(!db) return msg('Wiederherstellen ist in dieser Ansicht nicht verfügbar.');
  try{
    msg('Sicherung wird gelesen …');
    const zip = await JSZip.loadAsync(file);
    const jf = zip.file('daten.json'); if(!jf) return msg('Das ist keine BauPilot-Sicherung (daten.json fehlt).');
    const all = JSON.parse(await jf.async('string'));
    await restoreData(all, zip, msg);
  }catch(err){ console.error(err); msg('Wiederherstellen fehlgeschlagen: '+(err?.message||err?.code||'Fehler')); }
}
async function restoreData(all, zip, msg){
  try{
    if(!all.meta || all.meta.app!=='BauPilot') return msg('Das ist keine BauPilot-Sicherung.');
    const jobs = [];
    const top = (col, arr) => (arr||[]).forEach(x=>jobs.push({path:col+'/'+x.id, data:x.data}));
    (all.projekte||[]).forEach(p=>{ jobs.push({path:'projekte/'+p.id, data:p.data});
      for(const c of ['entries','wetter','protokolle','belege','dokumente','anfragen','vergleiche','lv','fotos']) (p[c]||[]).forEach(x=>jobs.push({path:`projekte/${p.id}/${c}/${x.id}`, data:x.data})); });
    top('bltodo',all.bltodo); top('todos',all.todos); top('bestellungen',all.bestellungen); top('infos',all.infos); top('belege',all.belege); top('papierkorb',all.papierkorb); top('archiv',all.archiv);
    if(all.config && Object.keys(all.config).length) jobs.push({path:'config/belege', data:all.config});
    const when = all.meta.exportiert ? new Date(all.meta.exportiert).toLocaleString('de-DE') : '?';
    if(!confirm(`Sicherung vom ${when}\n${jobs.length} Einträge${all.meta.bilder?', '+all.meta.bilder+' Bilder':''}.\n\nJetzt wiederherstellen? Es wird nichts gelöscht; gleiche Einträge werden mit dem Stand der Sicherung überschrieben.`)) return msg('Abgebrochen.');
    const ass = (typeof assets!=='undefined' && assets) ? assets : null; let nUp = 0, nMiss = 0;
    const fixPhotos = async (o) => {
      if(Array.isArray(o)){ for(const x of o) await fixPhotos(x); return; }
      if(!o || typeof o!=='object') return;
      for(const [k,v] of Object.entries(o)){
        if((k==='photos'||k==='fotos'||k==='dateien') && Array.isArray(v)){
          for(const x of v){ if(!x || !x.datei) continue; const zf = zip && zip.file(x.datei);
            if(zf && x.id && !x.data){ let ok = false; try{ ok = (await fetch('/_blob/'+x.id)).ok; }catch(e){}
              if(!ok && ass){ try{ const bytes = await zf.async('uint8array'); const pdf = bytes[0]===0x25 && bytes[1]===0x50; const blob = new Blob([bytes], {type: pdf?'application/pdf':'image/jpeg'}); const r = await ass.upload(blob, {type: blob.type}); if(r && r.id){ x.id = r.id; if(r.url) x.url = r.url; nUp++; } }catch(e){ console.error(e); nMiss++; } }
              else if(!ok) nMiss++; }
            delete x.datei; }
        } else await fixPhotos(v);
      }
    };
    let n = 0;
    for(const j of jobs){
      const d = cl(j.data) || {};
      if(d.datei && !d.data){ const zf = zip && zip.file(d.datei); if(zf){ d.data = `data:${d.mime||'image/jpeg'};base64,` + await zf.async('base64'); } delete d.datei; delete d.mime; }
      await fixPhotos(d);
      await db.doc(j.path).set(d); n++;
      if(n%10===0) msg(`Stelle wieder her … ${n}/${jobs.length}`);
    }
    msg(`✓ Fertig: ${n} Einträge wiederhergestellt${nUp?`, ${nUp} Bilder neu hochgeladen`:''}${nMiss?`, ${nMiss} Bilder nicht ladbar`:''}. Bitte die App einmal neu laden.`);
  }catch(err){ console.error(err); msg('Wiederherstellen fehlgeschlagen: '+(err?.message||err?.code||'Fehler')); }
}

async function autoBackup(){

  try{
    const day = todayKey(), ref = db.doc('sicherungen/'+day), ex = await ref.get();
    if(ex.exists){ const x = ex.data(); if(x.assetId || (Date.now()-new Date(x.start||0).getTime()) < 600000) return; }
    await ref.set({datum:day, start:new Date().toISOString(), art:'auto'});
    const all = await collectData();
    const jsonStr = JSON.stringify(all); const blob = new Blob([jsonStr], {type:'application/json'});
    const r = await assets.upload(blob, {type:'application/json'});
    await ref.set({datum:day, assetId:r.id, bytes:blob.size, erstellt:new Date().toISOString(), art:'auto', eintraege:all.meta.eintraege});

async function autoPrune(){
  const q = await db.collection('sicherungen').get(); const rows = q.docs.map(d=>({id:d.id, ...cl(d.data())})).filter(x=>x.assetId).sort((a,b)=>b.id.localeCompare(a.id));
  const keep = new Set(rows.slice(0,14).map(x=>x.id)); const firstOfMonth = {};
  rows.forEach(x=>{ const m = x.id.slice(0,7); if(!firstOfMonth[m] || x.id < firstOfMonth[m]) firstOfMonth[m] = x.id; });
  Object.entries(firstOfMonth).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,36).forEach(([m,id])=>keep.add(id));
  for(const x of rows){ if(keep.has(x.id)) continue; try{ await assets.delete(x.assetId); }catch(e){ console.error(e); } try{ await db.doc('sicherungen/'+x.id).delete(); }catch(e){ console.error(e); } }
}

async function exportAll(only){
  const msg = t => { const e = $('#exportMsg'); if(e) e.textContent = t; else if(t) toast(t, 5000); };
  if(!window.JSZip) return msg('ZIP-Modul nicht geladen.');
  if(!downloads) return msg('Speichern ist in dieser Ansicht nicht verfügbar.');
  const zip = new JSZip(); const all = {}; let nPh = 0, nFail = 0;
  const grab = async path => (await db.collection(path).get()).docs.map(d=>({id:d.id, data:d.data()}));
  const b64 = u => { const m = /^data:[^;,]*;base64,(.*)$/.exec(u||''); return m ? m[1] : null; };
  const walk = async (o, tag) => {
    if(Array.isArray(o)){ for(const x of o) await walk(x, tag); return; }
    if(!o || typeof o!=='object') return;
    for(const [k,v] of Object.entries(o)){
      if((k==='photos'||k==='fotos'||k==='dateien') && Array.isArray(v)){
        for(const x of v){
          if(x && x.id && !x.data){ try{ const r = await fetch('/_blob/'+x.id); if(!r.ok) throw 0; zip.file(`bilder/${tag}_${x.id}.jpg`, await r.blob()); x.datei = `bilder/${tag}_${x.id}.jpg`; nPh++; }catch(e){ nFail++; } }
        }
      } else await walk(v, tag);
    }
  };
  try{
    msg('Daten werden gelesen …');
    all.projekte = [];
    for(const p of await grab('projekte')){
      if(only && p.id!==only) continue;
      msg('Lese: '+(p.data.baustelle||p.id)+' …');
      const pr = {id:p.id, data:p.data};
      for(const c of ['entries','wetter','protokolle','belege','dokumente','anfragen','vergleiche','lv']){ pr[c] = await grab(`projekte/${p.id}/${c}`); }
      const fotos = await grab(`projekte/${p.id}/fotos`); pr.fotos = [];
      for(const f of fotos){
        const d = {...f.data}; const b = b64(d.data);
        if(b){ zip.file(`fotos/${p.id}/${f.id}.jpg`, b, {base64:true}); d.mime = (/^data:([^;,]*)/.exec(d.data)||[])[1]||'image/jpeg'; d.data = ''; d.datei = `fotos/${p.id}/${f.id}.jpg`; nPh++; }
        pr.fotos.push({id:f.id, data:d});
      }
      for(const c of ['entries','protokolle','belege','dokumente','anfragen','vergleiche']) await walk(pr[c], 'p_'+p.id);
      all.projekte.push(pr);
    }
    msg('Lese Aufgaben und Belege …');
    const fp = a => only ? a.filter(x=>x.data && x.data.projId===only) : a; all.bltodo = fp(await grab('bltodo')); all.todos = fp(await grab('todos')); all.bestellungen = fp(await grab('bestellungen')); all.infos = fp(await grab('infos')); all.belege = only ? [] : await grab('belege'); all.papierkorb = only ? [] : await grab('papierkorb'); all.archiv = only ? [] : await grab('archiv');
    await walk(all.belege, 'beleg');
    const cfg = await db.doc('config/belege').get(); all.config = (!only && cfg.exists) ? cfg.data() : {};
    all.meta = {app:'BauPilot', projekt: only||'', exportiert:new Date().toISOString(), bilder:nPh, bilderNichtGeladen:nFail};
    zip.file('daten.json', JSON.stringify(all, null, 1));
    zip.file('LIESMICH.txt', 'BauPilot – Datensicherung vom '+new Date().toLocaleString('de-DE')+'\n\ndaten.json enthält alle Datensätze (Baustellen, Bautagebuch, Wetter, Protokolle, Aufgaben, Belege, Einstellungen).\nFotos liegen in den Ordnern fotos/ und bilder/; Aufgaben-Bilder sind direkt in daten.json eingebettet.\n');
    msg('ZIP wird erstellt …');
    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    lastZipName = only ? `BauPilot_Baustelle_${String((projects.get(only)||archProjects.get(only)||{}).baustelle||only).replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g,'_')}_${todayKey()}.zip` : `BauPilot_Sicherung_${todayKey()}.zip`;
    await downloads.save({filename:lastZipName, data: blob});
    if(!only){ try{ lastBackup = new Date().toISOString(); await db.doc('config/backup').set({letzte:lastBackup}); }catch(e){ console.error(e); } }
    msg(`✓ Gespeichert (${(blob.size/1048576).toFixed(1)} MB, ${nPh} Fotos${nFail?`, ${nFail} nicht ladbar`:''})`);
    return true;
  }catch(err){ if(err?.code==='declined'){ msg(''); return false; } console.error(err); msg('Export fehlgeschlagen: '+(err?.code||err?.message||'Fehler')); return false; }
}

let rec = null, dictId = '', recBroken = '';

/* Diktat: gesprochene Zahlen (zwanzig, dreiundzwanzig, hundert zwanzig, zwei Komma fünf) als Ziffern schreiben; "ein/eine" bleiben Artikel */
const NW_U={null:0,eins:1,ein:1,eine:1,einen:1,einem:1,einer:1,eines:1,zwei:2,zwo:2,drei:3,vier:4,fünf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwölf:12,dreizehn:13,vierzehn:14,fünfzehn:15,sechzehn:16,siebzehn:17,achtzehn:18,neunzehn:19};
const NW_T={zwanzig:20,dreißig:30,dreissig:30,vierzig:40,fünfzig:50,sechzig:60,siebzig:70,achtzig:80,neunzig:90};
function nwParse(w){
  if(!w) return null;
  let i = w.indexOf('tausend');
  if(i>=0){ const l = i===0?1:nwParse(w.slice(0,i)), r = w.length===i+7?0:nwParse(w.slice(i+7)); return (l==null||r==null||l<1||l>999||r>999)?null:l*1000+r; }
  i = w.indexOf('hundert');
  if(i>=0){ const l = i===0?1:nwParse(w.slice(0,i)), r = w.length===i+7?0:nwParse(w.slice(i+7)); return (l==null||r==null||l<1||l>9||r>99)?null:l*100+r; }
  if(w in NW_U) return NW_U[w];
  if(w in NW_T) return NW_T[w];
  const m = w.match(/^(.+)und(.+)$/); if(m && NW_T[m[2]] && NW_U[m[1]]>=1 && NW_U[m[1]]<=9) return NW_T[m[2]]+NW_U[m[1]];
  return null;
}
function numWords(text){
  if(!text) return text;
  const parts = String(text).split(/([A-Za-zÄÖÜäöüß]+)/);
  const art = new Set(['ein','eine','einen','einem','einer','eines']);
  const out = []; let i = 0;
  while(i < parts.length){
    if(i%2===0){ out.push(parts[i]); i++; continue; }
    let done = false;
    for(let j=i+2*Math.floor((Math.min(parts.length-1,i+8)-i)/2); j>=i && !done; j-=2){
      let ok = true; for(let k=i+1;k<j;k+=2){ if(!/^ +$/.test(parts[k])){ ok=false; break; } }
      if(!ok) continue;
      let s = ''; for(let k=i;k<=j;k+=2) s += parts[k].toLowerCase();
      if(j===i && art.has(s)) continue;
      const n = nwParse(s);
      if(n!=null){ out.push(String(n)); i = j+1; done = true; }
    }
    if(!done){ out.push(parts[i]); i++; }
  }
  return out.join('').replace(/(\d+) [Kk]omma (\d(?: \d)*)(?!\d)/g,(m,a,b)=>a+','+b.replace(/ /g,''));
}

function nwFix(el, keepCaret){
  try{
    if(!el || !(el.tagName==='TEXTAREA' || el.tagName==='INPUT') || el.readOnly || el.disabled || el.id==='histQ') return;
    if(el.tagName==='INPUT' && !/^text$/i.test(el.type||'text')) return;
    const old = el.value, nv = numWords(old); if(nv===old) return;
    const pos = el.selectionStart; el.value = nv;
    if(keepCaret && pos!=null){ const p = Math.max(0, nv.length-(old.length-pos)); try{ el.setSelectionRange(p,p); }catch(_e){} }

}

  r.lang = 'de-DE'; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
  const base = T.value.trim(); let got = false;

async function shrink(file, max=1600, q=0.82){
  { const f = ({spar:[.75,.92],hoch:[1.5,1.1]})[PREFS.fq]; if(f){ max = Math.round(max*f[0]); q = Math.min(.95, q*f[1]); } }
  let src = null, w = 0, h = 0, close = ()=>{};
  try{
    if(window.createImageBitmap){
      const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
      src = bmp; w = bmp.width; h = bmp.height; close = ()=>{ try{ bmp.close(); }catch(e){} };
    }
  }catch(e){ src = null; }
  let url = null;
  try{
    if(!src){
      url = URL.createObjectURL(file);
      const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Bild nicht lesbar')); i.src=url; });
      src = img; w = img.naturalWidth; h = img.naturalHeight;
    }
    if(!w || !h) throw new Error('Bild nicht lesbar');
    const sc = Math.min(1, max/Math.max(w,h));
    const c = document.createElement('canvas'); c.width = Math.round(w*sc); c.height = Math.round(h*sc);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Umwandeln fehlgeschlagen')),'image/jpeg',q));
  } finally { close(); if(url) URL.revokeObjectURL(url); }
}

async function pvShare(mode){
  const d = lastPreviewDoc; if(!d || !d.pages.length) return;
  const base = String((lastPreview && lastPreview.filename) || 'Druckvorschau.pdf').replace(/\.pdf$/i,'');
  const jpg = (c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q||.92));
  const mkPdf = ()=>{ const {jsPDF} = window.jspdf; const pdf = new jsPDF({unit:'mm',format:'a4'}); for(let i=0;i<d.pages.length;i++){ if(i) pdf.addPage(); pdf.addImage(d.pages[i].toDataURL('image/jpeg',.92),'JPEG',0,0,210,297); } return pdf.output('blob'); };
  let files, pdfBlob = null;
  try{
    if(mode==='pdf'){ pdfBlob = mkPdf(); files = [new File([pdfBlob], base+'.pdf', {type:'application/pdf'})]; }
    else { const bl = []; for(const c of d.pages) bl.push(await jpg(c)); files = bl.map((b,i)=>new File([b], d.pages.length>1 ? base+'_Seite'+(i+1)+'.jpg' : base+'.jpg', {type:'image/jpeg'})); }
    if(!navigator.share || (navigator.canShare && !navigator.canShare({files}))) throw new Error('nofiles');
    let wt = ''; try{ wt = (lastPreview && lastPreview.prot && lastPreview.prot.waText) ? lastPreview.prot.waText() : ''; }catch(_){} await navigator.share(wt ? {files, title: base, text: wt} : {files, title: base}); toast('✓ Geteilt');
  }catch(err){
    if(err && err.name==='AbortError') return;
    try{
      if(!pdfBlob) pdfBlob = mkPdf();
      if(downloads){ await downloads.save({filename: base+'.pdf', data: pdfBlob}); toast('Teilen geht in dieser Ansicht nicht – PDF gespeichert, bitte aus „Dateien“ in WhatsApp senden', 6000); }
      else toast('Teilen ist in dieser Ansicht nicht verfügbar', 5000);
    }catch(e2){ if(e2 && e2.code==='declined') return; console.error(e2); toast('Teilen nicht möglich'); }
  }
}

      if(col===0) need(h+4);
      doc.addImage(im.data,'JPEG', L+col*(cw+4), y, w, h);
      rowH = Math.max(rowH,h);
      col++; if(col===2){ col=0; y += rowH+4; rowH = 0; }
    }
  }

(function(){

  }); }catch(_){} };
  try{ document.documentElement.lang = 'de'; }catch(_){}
  fix(document);
  new MutationObserver(ms=>{ for(const m of ms) m.addedNodes.forEach(n=>{ if(n.nodeType===1){ fix(n); if(n.matches && n.matches('textarea,input')) fix(n.parentNode||document); } }); }).observe(document.body, {childList:true, subtree:true});

/* Große PDFs (über ca. 19 MB) automatisch in Teile unter 20 MB zerlegen; alle Teile außer dem letzten werden direkt ans Dokument gehängt, der letzte wird zurückgegeben. */
async function dkSplitPdf(f, d){
  if(!window.PDFLib) throw new Error('PDF-Modul zum Zerlegen nicht geladen');
  if(!assets) throw new Error('PDF-Speicher nicht verfügbar');
  const hint = m => { const h = document.querySelector('#dkHint'); if(h) h.textContent = m; };
  const {PDFDocument} = window.PDFLib, MB = 1024*1024, LIM = 10*MB;
  hint('Großes PDF wird eingelesen …');
  const src = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption:true});
  const total = src.getPageCount(), base = f.name.replace(/\.pdf$/i,'');
  const build = async (a,b)=>{
    const doc = await PDFDocument.create();
    const pgs = await doc.copyPages(src, Array.from({length:b-a},(_,i)=>a+i));
    pgs.forEach(p=>doc.addPage(p));
    return new Blob([await doc.save()], {type:'application/pdf'});
  };
  const out = [];
  const run = async (a,b)=>{
    hint(`Seiten ${a+1}–${b} von ${total} werden zerlegt …`);
    const blob = await build(a,b);
    if(blob.size > LIM && b-a > 1){ const m = (a+b)>>1; await run(a,m); await run(m,b); return; }
    if(blob.size > 20*MB) throw new Error(`Seite ${a+1} allein größer als 20 MB`);
    out.push({a,b,blob});
  };
  const step = Math.max(1, Math.ceil(total / Math.max(2, Math.ceil(f.size/(9*MB)))));
  for(let a=0;a<total;a+=step) await run(a, Math.min(total, a+step));
  const res = [];
  for(let i=0;i<out.length;i++){
    hint(`Teil ${i+1} von ${out.length} wird hochgeladen …`);
    const up = () => assets.upload(out[i].blob, {type:'application/pdf'});
    let r; try{ r = await up(); }catch(err){ if(err?.code==='store_unavailable'){ await sleep(1200); r = await up(); } else throw err; }
    res.push({id:r.id, name:`${base} – Teil ${i+1} (Seiten ${out[i].a+1}–${out[i].b}).pdf`, typ:'pdf'});
  }
  const last = res.pop();
  if(res.length){ d.dateien = [...(d.dateien||[]), ...res]; dkSave(d); }
  return last;
}
async function dkFile(f, d){
  const isPdf = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);
  if(isPdf && f.size > 300*1024*1024) throw new Error('PDF ist größer als 300 MB – bitte in Teile zerlegen');
  if(isPdf && f.size > 12*1024*1024){ try{ return await dkSplitPdf(f, d); }catch(e){ console.error(e); toast('PDF zerlegen fehlgeschlagen: '+(e?.code||e?.message||e), 8000); throw e; } }
  let blob = null, inline = null;
  if(!isPdf){
    for(const [mx,q] of [[1400,.7],[1100,.6],[800,.5]]){ try{ blob = await shrink(f, mx, q); }catch(e){ blob = null; break; } if(blob.size <= 200*1024) break; }

      const used = (d.dateien||[]).reduce((a,x)=>a+(x.data?x.data.length:0),0), data = await toDataUrl(blob);
      if(blob.size <= 260*1024 && used + data.length <= 700000) inline = {data, name:f.name, typ:'img'};
    }
  }
  if(inline) return inline;
  if(!assets) throw new Error(isPdf ? 'PDF-Speicher nicht verfügbar' : 'Bild zu groß für die Datenbank und kein Bildspeicher verfügbar');
  const up = blob || f;
  const r = await Promise.race([assets.upload(up, {type: isPdf ? 'application/pdf' : (up.type||'image/jpeg')}), new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout', message:'Speicher antwortet nicht'}),25000))]);
  return {id:r.id, name:f.name, typ: isPdf ? 'pdf' : 'img'};
}

  if(el.dataset && el.dataset.dkf){ const d = dk.get(dkCur); if(!d) return; d[el.dataset.dkf] = el.value; dkSave(d); return; }
  if(el.id==='dkfile'){
    const files = [...el.files]; el.value = ''; const d = dk.get(dkCur); if(!d || !files.length) return;
    const hint = () => $('#dkHint'); let err = '';
    for(let i=0;i<files.length;i++){
      if(hint()) hint().textContent = `Datei ${i+1} von ${files.length} wird geladen …`;
      try{ const x = await dkFile(files[i], d); d.dateien = [...(d.dateien||[]), x]; dkSave(d); }
      catch(e){ console.error(e); err = e?.code || e?.message || 'Fehler'; }
    }
    if(dkCur===d.id){ renderDoku(); if(err && hint()) hint().textContent = 'Fehler: '+err; }
  }
});

const TLN_ROWS = 8;
const TLN_QUICK = ['Facharbeiter','Bauhelfer','Polier','Bagger mit Bedienung','Radlader mit Bedienung','LKW mit Fahrer','Kleingerät'];
const tlnH = v => { const n = parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n) ? n : 0; };
const tlnF = n => { n = Math.round(n*100)/100; return (Math.abs(n*10-Math.round(n*10))<1e-9 ? n.toFixed(1) : n.toFixed(2)).replace('.',','); };
const TLN_KATS = [['lohn','Lohn / Personal'],['masch','Maschinen / Geräte'],['mat','Material']];
const tlnGuess = r => /bagger|radlader|lkw|kran|kompressor|stapler|walze|raupe|gerät|maschine|hammer|fräse|lader|dumper|transporter|pritsche|container|mulde|bohr|schneid|pumpe|aggregat/i.test(String(r.text||'')) ? 'masch' : 'lohn';
const tlnKat = r => r.kat || tlnGuess(r);
function tlnNorm(t){ let ch = false; (t.rows||[]).forEach(r=>{ if(!r.kat){ r.kat = tlnGuess(r); ch = true; } }); return ch; }
const tlnRT = r => tlnKat(r)==='mat' ? 0 : ((r.anz===undefined||String(r.anz).trim()==='') ? 1 : tlnH(r.anz)) * tlnH(r.std);
const tlnBlankRows = () => [{kat:'lohn',text:'',anz:'',std:''},{kat:'lohn',text:'',anz:'',std:''},{kat:'lohn',text:'',anz:'',std:''},{kat:'masch',text:'',anz:'',std:''},{kat:'masch',text:'',anz:'',std:''},{kat:'mat',text:'',anz:'',einh:''},{kat:'mat',text:'',anz:'',einh:''}];

function nextTlnNr(){

  return any ? String(m+1) : '1';
}

const tlnAll = () => [...dk.values()].filter(x=>x.typ==='tln'&&x.tln).sort((a,b)=>String(b.tln.datum||'').localeCompare(String(a.tln.datum||''))||(+b.tln.nr||0)-(+a.tln.nr||0));
const tlnHasText = x => !!(String(x.tln.arbeiten||'').trim() || (x.tln.rows||[]).some(r=>String(r.text||'').trim()));
function tlnSigs(){ const out = {}; for(const x of tlnAll()){ const s = x.tln.sig||{}; for(const k of ['an','ag']) if(!out[k] && s[k]) out[k] = s[k]; } return JSON.parse(JSON.stringify(out)); }

function tlnRenum(base){
  const l = tlnAll().filter(x=>/^\d+$/.test(String(x.tln.nr||'').trim()));
  if(!l.length) return 0;
  l.sort((a,b)=>String(a.tln.datum||'').localeCompare(String(b.tln.datum||''))||(+a.tln.nr-+b.tln.nr)||String(a.angelegt||'').localeCompare(String(b.angelegt||'')));

  return n;
}
function copyTln(){

  c.titel = 'Tagelohnnachweis '+fmtDate(todayKey()); c.datum = todayKey(); c.angelegt = new Date().toISOString(); c.dateien = []; c.notiz = '';

async function tlnPic(src){
  try{ return await imgData(src); }catch(e1){}
  const el = new Image(); await new Promise((res,rej)=>{ el.onload=res; el.onerror=()=>rej(new Error('Bild nicht ladbar')); el.src = src; });
  const w = el.naturalWidth, h = el.naturalHeight, m = Math.min(1, 1600/Math.max(w,h)); const c = document.createElement('canvas'); c.width = Math.round(w*m); c.height = Math.round(h*m);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(el,0,0,c.width,c.height);
  return await imgDataUrl(c.toDataURL('image/jpeg',.85));
}

/* ---------- Zeiterfassung (Dokumente → Zeiterfassung): Wochenblatt mit Formeln ---------- */
const ZE_DAYS = ['Mo.','Di.','Mi.','Do.','Fr.','Sa.'];
const zeMon = k => { const d = parseKey(k); d.setDate(d.getDate()-((d.getDay()+6)%7)); return keyOf(d); };
const zeAdd = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const zeTitle = mon => { const w = isoWeek(mon); return 'Zeiterfassung Woche '+pad(w.w)+'/'+w.y; };
/* Eingaben wie 7, 07:00, 7.30, 19.00, 1900 (Uhrzeit) bzw. 1, 1:00, 0,5, 30 (Dauer) → Minuten; leer → null; ungültig → NaN */
function zeMin(v, mode){
  let s = String(v==null?'':v).trim().toLowerCase(); if(!s) return null;
  const um = s.match(/^(\d+(?:[.,]\d+)?)\s*(?:min\.?|minuten)$/); if(um) return Math.round(parseFloat(um[1].replace(',','.')));
  s = s.replace(/\s*(?:uhr|std\.?|stunden|h)$/,'').replace(',','.'); if(!s) return NaN;
  let m = s.match(/^(\d{1,2})[:.](\d{2})$/); if(m) return (+m[1])*60 + (+m[2]);
  m = s.match(/^(\d{1,2}):(\d)$/); if(m) return (+m[1])*60 + (+m[2])*10;   /* 1:0 → 1:00, 1:3 → 1:30 */
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  if(s.indexOf('.')>=0) return Math.round(parseFloat(s)*60);
  const n = +s;
  if(mode==='t') return s.length>=3 ? Math.floor(n/100)*60 + n%100 : n*60;
  return n<5 ? n*60 : n;
}
const zeHM = m => Math.floor(m/60)+':'+pad(m%60);
const zeDec = m => (m/60).toFixed(2).replace('.',',');
function zeCalc(r, auto){
  const a = zeMin(r.von,'t'), b = zeMin(r.bis,'t'), p = zeMin(r.pause,'d'), w = zeMin(r.wege,'d');
  const bad = {von: isNaN(a)||a>1440, bis: isNaN(b)||b>1440, pause: isNaN(p), wege: isNaN(w)};
  let az = null, pa = 0;
  if(a!=null && b!=null && !bad.von && !bad.bis){
    let m = b-a; if(m<0) m += 1440;
    if(p && !bad.pause) m -= p;
    else if(auto && p==null){ pa = m>540 ? 45 : m>360 ? 30 : 0; m -= pa; }   /* gesetzliche Pause (ArbZG): über 6 h 30 min, über 9 h 45 min */
    az = Math.max(0,m);
  }
  return {az, pa, wege: (w && !bad.wege) ? w : 0, bad};
}
function zeTot(z){ let a = 0, w = 0; (z.rows||[]).forEach(r=>{ const c = zeCalc(r, z.autoPause); a += c.az||0; w += c.wege; }); return {a, w}; }
const zeTimers = {};
function zeSchedule(d){ clearTimeout(zeTimers[d.id]); zeTimers[d.id] = setTimeout(()=>dkSave(d), 600); }

function renderZe(d){
  const z = d.ze = d.ze || {}; z.rows = z.rows || []; const mon = zeMon(z.wb||todayKey()); while(z.rows.length<6) z.rows.push({datum:zeAdd(mon,z.rows.length), von:'', bis:'', pause:'', wege:'', nacht:false, ort:''});
  const ro = canWrite ? '' : 'disabled', wk = isoWeek(mon), t = zeTot(z), empty = z.rows.every(r=>!r.von && !r.bis && !r.ort);

async function exportZePdf(id){

function zeSet(el){

}

document.addEventListener('change', ev=>{
  const el = ev.target; if(tab!=='doku' || !el.dataset) return;
  if(el.id==='zeSel' && dk.has(el.value)){ dkCur = el.value; dkAsk = false; renderDoku(); window.scrollTo(0,0); return; }
  if(el.dataset.ze==='wb'){
    const d = dk.get(dkCur); if(!d || !d.ze || !canWrite || !el.value) return;

  }

});
document.addEventListener('click', ev=>{
  const t = ev.target.closest('button'); if(!t || tab!=='doku') return;
  if((t.id==='zeNew' || t.id==='zeNew2') && canWrite){ newZe(zeNextWb()); return; }

});

  const T = amType(r.typ), c = amCalc(r); if(!c.used) return '';

  if(T.k==='stk'){ const vs = ['a','b','c'].map(k=>String(r[k]||'').trim()).filter(Boolean); return (AM_COUNT.includes(c.u) ? n+' '+c.u+(vs.length?'  (Maße: '+vs.join(' × ')+')':'') : [n].concat(vs).join(' × ')+' = '+(r.neg?'−':'')+amF(Math.abs(c.v))+' '+c.u); }

async function exportAmPdf(ids){

document.addEventListener('click', ev=>{
  const t = ev.target.closest('button'); if(!t || tab!=='doku') return;
  const d = dkCur && dk.get(dkCur); if(!d || d.typ!=='aufm' || !d.tln) return;
  if(t.id==='amAddRow' && canWrite){ openPick('new'); return; }
  if(t.dataset.amrm!==undefined && canWrite){ d.tln.rows.splice(+t.dataset.amrm,1); dkSave(d); renderDoku(); return; }
  if(t.id==='amNew' && canWrite){ newAm(); return; }
  if(t.id==='amCopy' && canWrite){ copyAm(); return; }
  if(t.id==='amTake' && canWrite){ takeAm(); return; }
  if(t.id==='amDelAsk' && canWrite){ dkAsk = true; renderDoku(); return; }
  if(t.id==='amDelNo'){ dkAsk = false; renderDoku(); return; }
  if(t.id==='amDelYes' && canWrite){ const nr = d.tln.nr; clearTimeout(tlnTimers[d.id]); tlnPend.delete(d.id); dkDel(d.id); dkCur = null; dkAsk = false; renderDoku(); toast('Aufmaß-Blatt Nr. '+nr+' gelöscht', 4000); return; }
  if(t.id==='amPrev'){ const id = d.id; showPreview([], 'Aufmaß-Blatt', amFile(d), {draw: doc=>drawAm(doc,id), exp: ()=>exportAmPdf(id)}); return; }
  if(t.id==='amPdf'){ exportAmPdf(d.id); return; }
  if(t.id==='amMail'){ amMailPanel(d.id); return; }
  if(t.id==='amMulti'){ amMultiPanel(); return; }
});

/* ---------- Abschlagsrechnungen (Dokumente → Abschlagsrechnungen): Editor, Druckvorschau, PDF, E-Mail ---------- */
const AR_KAT = 'Abschlagsrechnungen';
const arN = v => tlnH(v);
const arR = n => Math.round((n + Number.EPSILON)*100)/100;
const arEur = n => arR(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const arQty = n => (Math.round(n*1000)/1000).toLocaleString('de-DE',{maximumFractionDigits:3});
function arCalc(a){
  const rows = (a.rows||[]).map(r=>({...r, bet: arR(arN(r.menge)*arN(r.ep))}));
  const netto = arR(rows.reduce((s,r)=>s+r.bet,0));
  const vor = arR(arN(a.vorher)), net2 = arR(netto-vor);
  const pct = a.mwst===undefined || a.mwst==='' ? 19 : arN(a.mwst), ust = arR(net2*pct/100);
  return {rows, netto, vor, net2, pct, ust, brutto: arR(net2+ust)};
}
function nextArNr(){ let m = 0; for(const x of dk.values()){ if(x.typ==='ar' && x.ar && /^\d+$/.test(String(x.ar.nr||'').trim())) m = Math.max(m, +x.ar.nr); } return String(m+1); }
const arFile = d => `Abschlagsrechnung_Nr${safe((d.ar&&d.ar.nr)||'')}_${(d.ar&&d.ar.datum)||todayKey()}_${safe((d.ar&&d.ar.bauvorhaben)||'')}.pdf`;
const arTitle = a => `${String(a.nr||'').trim()?a.nr+'. ':''}Abschlagsrechnung`;
function newAr(){
  const s = settings || {}, id = 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), nr = nextArNr();
  const d = {id, kat:AR_KAT, typ:'ar', titel:nr+'. Abschlagsrechnung', datum:todayKey(), notiz:'', dateien:[], angelegt:new Date().toISOString(),
    ar:{nr, datum:todayKey(), bauvorhaben:s.baustelle||'', kunde:s.auftraggeber||'', anschrift:'', lv:'', zeitraum:'', mwst:19, vorher:'', zahlung:'Zahlbar innerhalb von 14 Tagen nach Rechnungseingang ohne Abzug.', hinweis:'', rows:[{oz:'',text:'',menge:'',me:'',ep:'',aufm:''}]}};
  dkSave(d); dkCur = id; dkAsk = false; renderDoku(); window.scrollTo(0,0);
}

      <p class="hint" style="margin:8px 0 0">Positionen mit Menge und Einheitspreis eintragen oder Mengen aus den Aufmaß-Blättern übernehmen. Danach Druckvorschau, PDF speichern oder direkt per E-Mail senden.</p></div>

function arSync(d){

    const m = String(x.tln.leistung||'').match(/^OZ\s+([\d.]+)\s*[–-]\s*(.*?)(?:\s*\(LV-Menge.*)?$/); if(!m) return;

const SCAN_PART_BYTES = 14*1024*1024;
