<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App installieren</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap" style="padding:40px 20px;max-width:560px">
<h1>Du wurdest eingeladen</h1>
<p class="lead">Installiere <span data-name>BauPilot</span> in wenigen Sekunden auf deinem Handy. Du brauchst keinen App-Store.</p>
<p><button class="btn gelb gross" data-install type="button">App installieren</button></p>
<p class="hilfe">Auf dem iPhone öffnest du diese Seite in Safari. Dann zeigt dir der Knopf die drei Schritte.</p>
<p><a href="app.html">App direkt öffnen</a></p>
</main>
<script>(function(){var t=new URLSearchParams(location.search).get('einladung');if(!t)return;
var app=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
var ziel='/api/einladung?t='+encodeURIComponent(t);
if(app){location.replace(ziel);return}
document.addEventListener('DOMContentLoaded',function(){var m=document.querySelector('main');var p=document.createElement('p');var a=document.createElement('a');a.className='btn gelb gross';a.href=ziel;a.textContent='Einladung annehmen und im Browser öffnen';p.appendChild(a);m.appendChild(p);var h=document.createElement('p');h.textContent='Tipp: Nimm die Einladung zuerst an und installiere die App danach auf dem Home-Bildschirm.';m.appendChild(h)});
})();</script>
<script src="site.config.js"></script><script src="install.js"></script>
<script>var S=window.SITE||{};if(S.name)document.querySelectorAll('[data-name]').forEach(function(e){e.textContent=S.name});</script>
<script src="sprachen.js"></script><script src="woerter.js"></script><script src="i18n.js"></script>
</body></html>
