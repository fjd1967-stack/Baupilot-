<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BauPilot</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#ff5a14">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="./"><i></i><span data-name>BauPilot</span></a></header>
  <main class="danke">
    <h1>Deine App wird freigeschaltet.</h1>
    <p class="lead">Hier startet später <span data-name>BauPilot</span>. Die Installation hat schon geklappt, die App selbst zieht in Kürze auf diese Adresse um.</p>
  </main>
</div>
<script>if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });</script>
<script src="site.config.js"></script>
<script>(function(){var n=(window.SITE||{}).name;if(!n)return;var e=document.querySelectorAll("[data-name]");for(var i=0;i<e.length;i++)e[i].textContent=n;document.title=document.title.replace(/BauPilot/g,n);})();</script>
</body>
</html>
